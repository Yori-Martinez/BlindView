<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <img src="../image.png" alt="BlindView Logo" class="logo-img">
    </a >
    <button class="btn-ayuda" id="btnAyuda">AYUDA</button>
    </header>

    <main class="main-content">
        <div class="login-card">
            <form id="loginForm" action="#" method="POST">
                
                <div class="form-group">
                    <label for="correo">CORREO ELECTRONICO</label>
                    <input type="email" id="correo" placeholder="CORREO" required>
                </div>

                <div class="form-group">
                    <label for="contrasena">CONTRASEÑA</label>
                    <input type="password" id="contrasena" placeholder="*******" required>
                </div>

                <div class="forgot-password" style="text-align: center; margin-bottom: 25px;">
                    <a href="#">Forgot password?</a>
                </div>

                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <button type="submit" class="btn-iniciar">INICIAR SESION</button>
                    <button type="button" class="btn-iniciar" id="btnIrRegistro">REGISTRARSE</button>
                </div>
                
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
